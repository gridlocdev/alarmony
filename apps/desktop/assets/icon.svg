<?xml version="1.0" encoding="UTF-8"?>
<!-- Alarmony's icon. 1024 canvas on Apple's icon grid: an 824-unit tile at (100,100) with a transparent
     margin; scripts/make-icons.sh crops to the tile for Windows and Linux, so keep the tile there.
     Glyph: an alarm clock, a round face with two hands, two bells on top and two feet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#F7A440" />
      <stop offset="1" stop-color="#C25A08" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />

  <g transform="translate(0 -22)">
    <g fill="#FFFFFF">
      <path d="M -88 0 A 88 88 0 0 1 88 0 Z" transform="translate(322 350) rotate(-45)" />
      <path d="M -88 0 A 88 88 0 0 1 88 0 Z" transform="translate(702 350) rotate(45)" />
      <circle cx="512" cy="540" r="28" />
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="512" cy="540" r="212" stroke-width="46" />
      <path d="M 512 540 L 512 418" stroke-width="44" />
      <path d="M 512 540 L 598 598" stroke-width="44" />
      <path d="M 384 726 L 344 790" stroke-width="44" />
      <path d="M 640 726 L 680 790" stroke-width="44" />
    </g>
  </g>
</svg>
